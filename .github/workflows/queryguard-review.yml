name: QueryGuard review (reusable)

# The workflow any repository — public or private — adds a few lines to call.
# See docs/adopting-queryguard.md for the consumer-side snippet and setup notes.
#
# Deliberately does not `actions/checkout` the calling repository: every stage
# QueryGuard runs (ingest, extraction, schema discovery, N+1 cross-file
# resolution) reads the pull request over the GitHub API at its head SHA, never
# from local disk. A local checkout would also be the wrong tree half the time
# — this workflow runs in the *reviewer's* runner, not necessarily checked out
# at the commit being reviewed.

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number to review. Defaults to the triggering event's PR."
        required: false
        type: number
      liquibase-changelog-path:
        description: >-
          Path to the repository's root Liquibase changelog. Leave unset —
          QueryGuard discovers it automatically for a standard Spring Boot
          layout. Set only for a non-standard layout or an ambiguous repo.
        required: false
        type: string
      groq-model:
        description: "Override the default Groq model used for N+1 explanation prose."
        required: false
        type: string
      block-severities:
        description: "Comma-separated severities that make the review REQUEST_CHANGES. Defaults to CRITICAL,HIGH."
        required: false
        type: string
      queryguard-ref:
        description: "QueryGuard git ref to install (branch, tag, or commit SHA)."
        required: false
        type: string
        default: main
      python-version:
        required: false
        type: string
        default: "3.11"
    secrets:
      groq-api-key:
        description: "Optional. Enables Groq-authored prose for N+1 findings. Unset means a fully deterministic review."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install QueryGuard
        run: python -m pip install "git+https://github.com/pranavatfinzly/QueryGuard.git@${{ inputs.queryguard-ref }}"
      - name: Smoke test
        # Catches a packaging regression (a module missing from
        # pyproject.toml's install dependencies, an import-time error) before
        # it reaches a real pull request rather than surfacing as a mid-run
        # ModuleNotFoundError.
        run: queryguard --help
      - name: Review pull request
        env:
          # The default per-run Actions token, automatically scoped to the
          # calling repository — no pass-through needed, and nothing to add to
          # that repository's secrets. On a pull_request from a fork this
          # token is read-only regardless of the `permissions:` block above
          # (GitHub's own protection against a fork escalating to write
          # access), so --post-comment silently cannot post there; see
          # docs/adopting-queryguard.md for the pull_request_target option
          # that restores it for public repositories that accept fork PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIQUIBASE_CHANGELOG_PATH: ${{ inputs.liquibase-changelog-path }}
          GROQ_API_KEY: ${{ secrets.groq-api-key }}
          GROQ_MODEL: ${{ inputs.groq-model }}
          QUERYGUARD_BLOCK_SEVERITIES: ${{ inputs.block-severities }}
        # A non-zero exit here (2 = blocking findings, 1 = QueryGuard could
        # not reliably analyze this pull request, 3 = misconfiguration) fails
        # this check, which is the point — see queryguard/cli.py's exit-code
        # constants.
        run: >-
          queryguard review
          --repo ${{ github.repository }}
          --pr ${{ inputs.pr-number || github.event.pull_request.number }}
          --post-comment
