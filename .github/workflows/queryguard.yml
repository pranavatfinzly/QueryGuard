name: QueryGuard

# QueryGuard reviewing its own pull requests (dogfooding), calling the
# reusable workflow this repository publishes for every other consumer — see
# queryguard-review.yml and docs/adopting-queryguard.md.

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: queryguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/queryguard-review.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      # Dogfooding always installs from the exact commit under review, not
      # `main` — otherwise a change to the reviewer's own logic would not be
      # exercised until after it merged.
      queryguard-ref: ${{ github.event.pull_request.head.sha }}
      liquibase-changelog-path: ${{ vars.LIQUIBASE_CHANGELOG_PATH }}
      groq-model: ${{ vars.GROQ_MODEL }}
      block-severities: ${{ vars.QUERYGUARD_BLOCK_SEVERITIES }}
    secrets:
      groq-api-key: ${{ secrets.GROQ_API_KEY }}
