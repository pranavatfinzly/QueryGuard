name: QueryGuard

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: queryguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QueryGuard
        run: python -m pip install .
      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path to the checked-out repository's root Liquibase changelog, e.g.
          # src/main/resources/db/payment-db-changelog.xml for galaxy-payment-service.
          # Set as a repository (or organization) Actions variable per consumer —
          # this workflow file does not change per repo. Unset means no schema is
          # available and every schema-dependent static rule stays silent, exactly
          # as before this variable existed.
          LIQUIBASE_CHANGELOG_PATH: ${{ vars.LIQUIBASE_CHANGELOG_PATH }}
        run: >-
          queryguard review
          --repo ${{ github.repository }}
          --pr ${{ github.event.pull_request.number }}
          --post-comment
