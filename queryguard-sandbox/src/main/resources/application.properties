# Sandbox configuration.
#
# Properties (not YAML) on purpose: this keeps Spring Boot off SnakeYAML, which
# is pinned to 1.33 for JavaFaker compatibility. See the note in pom.xml.
#
# The datasource points at a local throwaway Postgres. Never point this at a
# shared or production database — this app contains an UPDATE with no WHERE
# clause as a deliberate fixture.

spring.application.name=queryguard-sandbox

spring.datasource.url=jdbc:postgresql://localhost:5432/queryguard_sandbox
spring.datasource.username=queryguard
spring.datasource.password=queryguard

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seeder. Set seed-on-startup=false to boot without touching data.
sandbox.seed.seed-on-startup=true
sandbox.seed.customers=5000
sandbox.seed.random-seed=20260805

# Hard guard for the destructive planted bug. Leaving this false means the
# UPDATE-without-WHERE fixture is never executed, only analyzed statically.
sandbox.allow-destructive-fixtures=false

# Log the SQL Hibernate actually issues, so the N+1 fixture is visible in the
# statement log that QueryGuard's LLM stage reads.
logging.level.org.hibernate.SQL=DEBUG
